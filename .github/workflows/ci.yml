name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Path deps resolve to sibling checkouts (../tpt-io-standards), as on a dev machine.
      - name: Clone sibling path-dependency repos
        run: git clone --depth 1 https://github.com/tpt-solutions/tpt-io-standards.git ../tpt-io-standards
      - name: Engine tests
        run: cargo test -p tpt-cad-engine --locked

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Path deps resolve to sibling checkouts (../tpt-appfront, ../tpt-io-standards).
      - name: Clone sibling path-dependency repos
        run: |
          git clone --depth 1 https://github.com/tpt-solutions/tpt-appfront.git ../tpt-appfront
          git clone --depth 1 https://github.com/tpt-solutions/tpt-io-standards.git ../tpt-io-standards
      - name: Check free WASM build
        run: cargo check --target wasm32-unknown-unknown -p tpt-app-cad-format --locked
      - name: Check Pro WASM build
        run: cargo check --target wasm32-unknown-unknown -p tpt-app-cad-format --features pro --locked
